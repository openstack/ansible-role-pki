---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: "pki-${MOLECULE_SCENARIO_NAME}-1"
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    pre_build_image: true
    privileged: true
  - name: "pki-${MOLECULE_SCENARIO_NAME}-2"
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    pre_build_image: true
    privileged: true
    systemd: true

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  playbooks:
    prepare: prepare.yml
    converge: ../../tests/test.yml
    verify: verify.yml
  inventory:
    links:
      group_vars: ./group_vars/
  config_options:
    defaults:
      inject_facts_as_vars: false

scenario:
  name: standalone
