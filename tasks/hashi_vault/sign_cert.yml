- name: Check if certificate files exist
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  loop: "{{ _backend_install_certs }}"
  loop_control:
    label: "{{ item.dest }}"
  register: stat_results

- name: Create certificates
  vars:
    _regen_all: "{{ (pki_regen_cert | string | lower) == 'true' }}"
    _missing_cert_names: "{{ stat_results.results | default([]) | rejectattr('stat.exists') | map(attribute='item.name') | list }}"
    _target_cert_names: "{{ _missing_cert_names + ((pki_regen_cert is string and pki_regen_cert | length > 0) | ternary([pki_regen_cert], [])) }}"
    _vault_certs_to_generate: "{{ _regen_all | ternary(_backend_certs, _backend_certs | selectattr('name', 'in', _target_cert_names)) }}"
  when:
    - _vault_certs_to_generate | length > 0
  block:
    - name: Create certificate destination directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: >-
        {{
          _backend_install_certs
          | selectattr('name', 'in', _vault_certs_to_generate
          | map(attribute='name'))
          | map(attribute='dest')
          | map('dirname')
          | list
          | unique
        }}

    - name: Authenticate to {{ pki_hashi_vault_host }}
      ansible.builtin.include_tasks: hashi_vault/authenticate.yml
      when:
        - vault_login_data is not defined

    - name: Generate certificates via Vault PKI
      vars:
        ansible_python_interpreter: "{{ pki_setup_host_python_interpreter }}"
      delegate_to: "{{ pki_setup_host }}"
      community.hashi_vault.vault_pki_generate_certificate:
        url: "{{ pki_hashi_vault_host }}"
        token: "{{ vault_login_data.login.auth.client_token }}"
        role_name: "{{ cert.role | default(pki_hashi_vault_role) }}"
        common_name: "{{ cert.cn }}"
        alt_names: "{{ cert.san.dns | default(cert.alt_names | default(omit)) }}"
        ttl: "{{ cert.ttl | default(omit) }}"
        exclude_cn_from_sans: "{{ cert.exclude_cn_from_sans | default(False) }}"
        ip_sans: "{{ cert.san.ip | default(omit) }}"
        uri_sans: "{{ cert.san.uri | default(omit) }}"
        other_sans: "{{ cert.san.other | default(omit) }}"
        format: "{{ cert.format | default(omit) }}"
        private_key_format: "{{ cert.key_format | default(omit) }}"
        engine_mount_point: "{{ cert.engine_mount_point | default(pki_hashi_vault_engine_mount_point) }}"
      loop: "{{ _vault_certs_to_generate }}"
      loop_control:
        loop_var: cert
        label: "{{ cert.name }}"
      register: cert_data

    - name: Write certificate data
      vars:
        _vault_cert_data_map: |-
          {% set map = {} -%}
          {% for result in (cert_data.results | default([])) %}
          {%   if result.data is defined and result.data.data is defined %}
          {%     set _ = map.update({result.cert.name: result.data.data}) %}
          {%   endif %}
          {% endfor %}
          {{ map }}
        _format:
          "certificate": ['certificate']
          "certificate_chain": ['certificate', 'ca_chain']
          "ca_bundle": ['ca_chain']
          "private_key": ['private_key']
        _owner: "{{ item.owner | default(pki_install_owner) }}"
        _group: "{{ item.group | default(pki_install_group) }}"
        _mode: "{{ item.mode | d(pki_file_mode[item.type | d('certificate')]) }}"
      ansible.builtin.copy:
        # NOTE: Some cert types are presented in a list. It's required to make sure they are flattened and newline is
        #       added between them.
        # NOTE: Blank string is added as last element of the list to make sure that newline is added and the end of
        #       file. It's required when when other roles(like haproxy or zookeper) combine cert, ca_chain and private
        #       key into a single file.
        content: "{{ _format[item.type] | map('extract', _vault_cert_data_map[item.name]) | flatten | join('\n') ~ '\n' }}"
        dest: "{{ item.dest }}"
        owner: "{{ _owner }}"
        group: "{{ _group }}"
        mode: "{{ _mode }}"
      loop: "{{ _backend_install_certs | selectattr('name', 'in', _vault_certs_to_generate | map(attribute='name')) | list }}"
      loop_control:
        label: >-
          name: {{ item.name }},
          dest: {{ item.dest }},
          type: {{ item.type }},
          mode: {{ _mode }},
          owner: {{ _owner }},
          group: {{ _group }}
      ignore_errors: "{{ ansible_check_mode }}"
      notify:
        - "{{ pki_handler_cert_installed }}"
