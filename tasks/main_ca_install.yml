- name: Install standalone certificate authorities
  ansible.builtin.include_tasks: standalone/install_ca.yml
  vars:
    _backend_install_ca: "{{ _pki_install_ca_defs | selectattr('backend', 'equalto', 'standalone') | list }}"
  when:
    - _backend_install_ca | length > 0

- name: Install hashi_vault certificate authorities
  ansible.builtin.include_tasks: hashi_vault/install_ca.yml
  vars:
    _backend_install_ca: "{{ _pki_install_ca_defs | selectattr('backend', 'equalto', 'hashi_vault') | list }}"
  when:
    - _backend_install_ca | length > 0
