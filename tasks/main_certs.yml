- name: Sign and install certs for standalone backend
  vars:
    _backend_certs: "{{ _pki_certificates_defs | selectattr('backend', 'eq', 'standalone') | list }}"
    _backend_install_certs: "{{ _pki_install_certificates_defs | selectattr('backend', 'eq', 'standalone') | list }}"
  block:
    - name: Sign server certificates (standalone)
      ansible.builtin.include_tasks: standalone/sign_cert.yml
      when:
        - pki_create_certificates | default(true)
        - _backend_certs | length > 0

    - name: Install server certificates (standalone)
      ansible.builtin.include_tasks: standalone/install_cert.yml
      when:
        - pki_install_certificates | length > 0
        - _backend_install_certs | length > 0

- name: Sign and install server certificates (hashi_vault)
  ansible.builtin.include_tasks: hashi_vault/sign_cert.yml
  vars:
    _backend_certs: "{{ _pki_certificates_defs | selectattr('backend', 'eq', 'hashi_vault') | list }}"
    _backend_install_certs: "{{ _pki_install_certificates_defs | selectattr('backend', 'eq', 'hashi_vault') | list }}"
  when:
    - pki_create_certificates | default(true)
    - _backend_certs | length > 0
